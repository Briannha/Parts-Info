<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Basic page information. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Browser tab title. -->
  <title>Ford</title>

  <!--
  Shared stylesheet.
  This means all brand pages use the same overall design.
  -->
  <link rel="stylesheet" href="assets/style.css">

  <!--
  Shared JavaScript.
  At the moment this only updates the footer year automatically.
  -->
  <script defer src="assets/site.js"></script>

</head>
<body>

  <main class="wrap">

    <!--
    TOP BANNER
    Change the text inside <h1> if you want a different page title.
    -->
    <header class="hero">
      <div class="eyebrow">Brand Portal</div>
      <h1>Ford</h1>
      <p>
        Add Ford links, instructions, documents or reference tools here.
      </p>
    </header>

    <!--
    MAIN CONTENT AREA

    This is intentionally blank.

    Later, you can replace the placeholder box with:
    - links
    - buttons
    - documents
    - notes
    - procedures
    - tables
    - images
    -->
    <section class="section">

      <h2>Starter Content Area</h2>

      <div class="placeholder">

        <!--
        EXAMPLE SIMPLE LINK

        Remove the comment marks around the example below if you want to use it.

        <a href="https://example.com">Open Example Website</a>

        For another local HTML page, use:

        <a href="another-page.html">Open Another Page</a>
        -->

        No data has been added yet.

        Replace this area with your own Ford links,
        instructions, documents or reference information.

      </div>

      <!--
      This link returns to the main home page.
      -->
      <a class="back" href="index.html">← Back to Home</a>

    </section>

    <!-- Footer with automatic year. -->
    <div class="footer">
      Made by Briannha Harkin · <span data-year></span>
    </div>

  </main>
</body>
</html>
