<!DOCTYPE html>
<html lang="en">
<head>

  <!--
  ============================================================
  PAGE SETUP
  ============================================================

  <!DOCTYPE html>
  tells the browser that this is a modern HTML5 page.
  -->

  <meta charset="UTF-8">

  <!--
  Makes the page scale correctly on phones and tablets.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
  This text appears in the browser tab.
  -->
  <title>Knowledge Portal</title>

  <!--
  Loads the shared appearance file.
  All main colours, card styles and spacing live in assets/style.css.
  -->
  <link rel="stylesheet" href="assets/style.css">

  <!--
  Loads the shared JavaScript file.
  "defer" means the page HTML loads first.
  -->
  <script defer src="assets/site.js"></script>

</head>
<body>

  <!--
  .wrap keeps the whole site centred and at a sensible width.
  -->
  <main class="wrap">

    <!--
    HERO SECTION
    This is the large heading box at the top of the page.
    -->
    <header class="hero">

      <!-- Small heading above the main title. -->
      <div class="eyebrow">Starter Website</div>

      <!-- Main visible page title. -->
      <h1>Knowledge Portal</h1>

      <!-- Short description underneath the title. -->
      <p>
        A simple starter website with separate pages for Ford, Chery and MG.
      </p>

    </header>

    <!--
    MAIN LINKS SECTION
    This section contains the clickable brand cards.
    -->
    <section class="section">

      <h2>Brands</h2>

      <!--
      .grid automatically arranges the cards into columns.
      -->
      <div class="grid">

        <!--
        FORD CARD

        href="ford.html"
        means clicking this card opens ford.html.

        class="tile ford"
        means:
        - use the general card style called "tile"
        - also apply the Ford colour style called "ford"
        -->
        <a class="tile ford" href="ford.html">
          <span class="kicker">Brand</span>
          <span class="name">Ford</span>
          <span class="detail">
            Open the Ford reference page.
          </span>
        </a>

        <!-- CHERY CARD -->
        <a class="tile chery" href="chery.html">
          <span class="kicker">Brand</span>
          <span class="name">Chery</span>
          <span class="detail">
            Open the Chery reference page.
          </span>
        </a>

        <!-- MG CARD -->
        <a class="tile mg" href="mg.html">
          <span class="kicker">Brand</span>
          <span class="name">MG</span>
          <span class="detail">
            Open the MG reference page.
          </span>
        </a>

      </div>
    </section>

    <!--
    FOOTER

    The year is automatically inserted by assets/site.js.
    -->
    <div class="footer">
      Made by Briannha Harkin · <span data-year></span>
    </div>

  </main>
</body>
</html>
